name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content, metadata and cross-references
        run: node scripts/check.mjs
      - name: Syntax-check app and logic
        run: |
          node --check assets/app.js
          node --check assets/logic.js
          node --check assets/search.js
          node --check assets/theme.js
      - name: Unit and content tests
        run: node --test "tests/*.test.mjs"
      - name: Local lab tests (offline, mock tools, no cloud access)
        run: |
          node --test labs/rag-eval/test.mjs
          node --test labs/bounded-agent/test.mjs
      - name: RAG evaluation gate against committed baseline
        run: node labs/rag-eval/run.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets data .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
